[package]
name = "skill-hive"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
description = "Skill Hive desktop app"

[lib]
name = "skill_hive_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
hive-core = { workspace = true }
# `devtools` keeps the web inspector available in release builds (F12 / right-click > Inspect),
# so a blank window on a user's machine can be looked into without a debug build.
tauri = { version = "2.12", features = ["devtools"] }
tauri-plugin-dialog = "2.8"
tauri-plugin-opener = "2.7"
tauri-plugin-clipboard-manager = "2.3"
tauri-plugin-window-state = "2.5"
tauri-plugin-single-instance = "2.5"
# Native message boxes for fatal errors before the window exists; same features as the dialog
# plugin's own rfd so no extra backend is compiled in.
rfd = { version = "0.17", default-features = false, features = ["common-controls-v6"] }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
