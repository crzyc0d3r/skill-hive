[package]
name = "hive-core"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
description = "Skill Hive core: library, discovery, deployment, recommendation and evaluation of agent skills"

[features]
default = ["keyring"]
# OS keychain storage for provider secrets. Without it secrets use a 0600 file under the Hive home.
keyring = ["dep:keyring"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml_ng = "0.10"
thiserror = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
async-trait = "0.1"
futures = "0.3"
uuid = { workspace = true }
chrono = { workspace = true }
ts-rs = { workspace = true }
rusqlite = { version = "0.41", default-features = false, features = ["bundled", "cache"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "query", "gzip", "http2", "charset", "system-proxy", "stream"] }
sha2 = "0.11"
hex = "0.4"
walkdir = "2"
globset = "0.4"
regex = "1"
dirs = "7"
dunce = "1"
which = "8"
tempfile = "3"
indexmap = { version = "2", features = ["serde"] }
url = "2"
flate2 = "1"
tar = "0.4"
zip = { version = "9", default-features = false, features = ["deflate"] }
keyring = { version = "4", optional = true }

[target.'cfg(windows)'.dependencies]
junction = "2"

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true, features = ["test-util"] }
