name: Release

# Builds the desktop installers (macOS Apple Silicon and Intel, Windows, Linux) and the `hive` CLI
# binaries and attaches them to a published GitHub release. See docs/releasing.md.
#
# Runs on every push to `main`: when the version in Cargo.toml, package.json and
# src-tauri/tauri.conf.json has no `v<version>` tag yet, the tag and the release are created on
# that commit, so merging a version bump releases it. A push whose version is already tagged on
# another commit finishes in seconds with the build jobs skipped. The workflow also runs when a
# `v*` tag is pushed, and by hand from the Actions tab with the tag to release as input (the tag
# is created on the chosen commit if it does not exist yet).
#
# The `release` job creates the release once, with notes generated by GitHub, and exposes its id
# and tag. The two build jobs upload into that release by id. tauri-action is deliberately not
# given a tag: when it looks a published release up by tag it rewrites the release's name and
# body, which would replace the generated notes.
#
# Builds are unsigned unless these repository secrets exist (empty secrets count as missing):
#   APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY   sign the macOS app
#   APPLE_ID, APPLE_PASSWORD, APPLE_TEAM_ID                                 notarize it
#   TAURI_SIGNING_PRIVATE_KEY, TAURI_SIGNING_PRIVATE_KEY_PASSWORD            sign updater artifacts
#     (only used if bundle.createUpdaterArtifacts is turned on in src-tauri/tauri.conf.json)
# Windows installers are not signed by this workflow.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Tag to release, for example v0.1.0. Must match the version in Cargo.toml, package.json and src-tauri/tauri.conf.json."
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Create release
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      release_id: ${{ steps.release.outputs.id }}
    steps:
      - uses: actions/checkout@v4
      - name: Decide which tag to release
        id: tag
        env:
          INPUT_TAG: ${{ inputs.version }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          version="$(node -p "require('./package.json').version")"
          have="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          if [ "$have" != "$version" ]; then
            echo "::error::src-tauri/tauri.conf.json has version $have but package.json has $version"; exit 1
          fi
          have="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)"
          if [ "$have" != "$version" ]; then
            echo "::error::Cargo.toml has version $have but package.json has $version"; exit 1
          fi
          if [ -n "$INPUT_TAG" ]; then
            tag="$INPUT_TAG"
          elif [ "$REF_TYPE" = tag ]; then
            tag="$REF_NAME"
          else
            tag="v$version"
            # The peeled line (tag^{}) follows the plain one, so the last match is the commit.
            existing="$(git ls-remote --tags origin | awk -v t="refs/tags/$tag" '$2 == t || $2 == t "^{}" { sha = $1 } END { print sha }')"
            if [ -n "$existing" ] && [ "$existing" != "$GITHUB_SHA" ]; then
              echo "::notice::$tag already exists on $existing; nothing to release for this push"
              echo "tag=" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          case "$tag" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::Expected a tag like v0.1.0, got '$tag'"; exit 1 ;;
          esac
          if [ "${tag#v}" != "$version" ]; then
            echo "::error::The tag says ${tag#v} but the version files say $version"; exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@v2
        id: release
        if: steps.tag.outputs.tag != ''
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Skill Hive ${{ steps.tag.outputs.tag }}
          target_commitish: ${{ github.sha }}
          draft: false
          prerelease: false
          generate_release_notes: true

  build:
    name: App (${{ matrix.name }})
    needs: release
    if: needs.release.outputs.tag != ''
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            platform: macos-latest
            args: --target aarch64-apple-darwin
          - name: macOS Intel
            platform: macos-latest
            args: --target x86_64-apple-darwin
          - name: Linux x86_64
            platform: ubuntu-24.04
            args: ""
          - name: Windows x86_64
            platform: windows-latest
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
      - name: Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev patchelf build-essential pkg-config libxdo-dev libssl-dev
      - run: npm ci
      # Tauri signs the macOS app whenever APPLE_CERTIFICATE is set, even to an empty string, and
      # a missing secret expands to exactly that. So the signing secrets are exported only when
      # they have a value; without them the bundles are unsigned.
      - name: Export the signing secrets that are set
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY \
                      APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID \
                      TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD; do
            value="${!name}"
            if [ -n "$value" ]; then
              { echo "$name<<__SKILL_HIVE_SECRET__"; echo "$value"; echo "__SKILL_HIVE_SECRET__"; } >> "$GITHUB_ENV"
              echo "$name: set"
            else
              echo "$name: not set"
            fi
          done
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ needs.release.outputs.release_id }}
          # The app has no updater, so there is no latest.json to publish.
          uploadUpdaterJson: false
          args: ${{ matrix.args }}

  cli:
    name: CLI (${{ matrix.target }})
    needs: release
    if: needs.release.outputs.tag != ''
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: swatinem/rust-cache@v2
      - run: cargo build --release -p hive-cli --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            cp target/${{ matrix.target }}/release/hive.exe dist/
            (cd dist && 7z a ../hive-${{ matrix.target }}.zip hive.exe)
          else
            cp target/${{ matrix.target }}/release/hive dist/
            tar -C dist -czf hive-${{ matrix.target }}.tar.gz hive
          fi
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.release.outputs.tag }}
          draft: false
          prerelease: false
          files: |
            hive-*.tar.gz
            hive-*.zip
