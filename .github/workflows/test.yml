name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rust-tests:
    permissions:
      contents: read
      checks: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            label: Ubuntu
          - platform: macos-latest
            label: macOS
          - platform: windows-latest
            label: Windows
    runs-on: ${{ matrix.platform }}
    name: Rust tests (${{ matrix.label }})
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: ". -> target"
          save-if: ${{ runner.os != 'Windows' }}

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev patchelf build-essential pkg-config
          sudo apt-get install -y libayatana-appindicator3-dev || sudo apt-get install -y libappindicator3-dev

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --workspace

      - name: cargo deny
        shell: bash
        run: |
          set -euo pipefail
          version=0.20.2
          os=$(uname -s)
          arch=$(uname -m)
          bin=cargo-deny
          if [[ "$os" == MINGW* || "$os" == MSYS* || "$os" == CYGWIN* ]]; then
            target=x86_64-pc-windows-msvc
            bin=cargo-deny.exe
          elif [[ "$os" == Darwin && "$arch" == arm64 ]]; then
            target=aarch64-apple-darwin
          elif [[ "$os" == Darwin ]]; then
            target=x86_64-apple-darwin
          else
            target=x86_64-unknown-linux-musl
          fi
          url="https://github.com/EmbarkStudios/cargo-deny/releases/download/${version}/cargo-deny-${version}-${target}.tar.gz"
          curl -fsSL "$url" | tar -xz
          ./cargo-deny-${version}-${target}/${bin} --manifest-path ./Cargo.toml --workspace check advisories bans licenses sources

      - name: cargo audit
        uses: rustsec/audit-check@858dc40f52ca2b8570b7a997c1c4e35c6fc9a432 # v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Kill VC telemetry before cache save
        if: runner.os == 'Windows'
        continue-on-error: true
        run: taskkill /f /im vctip.exe
