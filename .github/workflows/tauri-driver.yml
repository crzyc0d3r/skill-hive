name: Tauri driver

on:
  pull_request:

permissions:
  contents: read

jobs:
  driver:
    name: tauri-driver (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            label: Linux
            binary: src-tauri/target/debug/skill-hive
          - os: windows-latest
            label: Windows
            binary: src-tauri/target/debug/skill-hive.exe
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev patchelf build-essential pkg-config xvfb
          sudo apt-get install -y libayatana-appindicator3-dev || sudo apt-get install -y libappindicator3-dev

      - name: Install npm dependencies
        run: npm ci

      - name: Build the desktop shell
        run: npx tauri build --debug --bundles none

      - name: Install tauri-driver
        run: cargo install tauri-driver --version 2.1.0 --locked

      - name: Drive the shell
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ runner.os }}" == "Linux" ]]; then
            xvfb-run -a node scripts/tauri-driver-suite.mjs "${{ matrix.binary }}"
          else
            node scripts/tauri-driver-suite.mjs "${{ matrix.binary }}"
          fi
